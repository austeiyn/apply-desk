# Netlify configuration for ApplyDesk (Next.js App Router).
# The Next.js runtime (OpenNext adapter) is detected and installed
# automatically; no plugin entry is required.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Long-running AI routes stream progress to the client; make sure responses
# are never cached at the edge.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
